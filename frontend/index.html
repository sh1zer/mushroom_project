<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Grzyby</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-dark bg-dark mb-4">
  <div class="container">
    <span class="navbar-brand">Grzyby - projekt Big Data</span>
  </div>
</nav>

<div class="container">
  <div class="row mb-4">
    <div class="col-md-3"><div class="card"><div class="card-body"><h6 class="card-subtitle text-muted">Zdarzenia</h6><h3 id="events">0</h3></div></div></div>
    <div class="col-md-3"><div class="card"><div class="card-body"><h6 class="card-subtitle text-muted">Nie jeść</h6><h3 id="flagged">0</h3></div></div></div>
    <div class="col-md-3"><div class="card"><div class="card-body"><h6 class="card-subtitle text-muted">Prawdopodobnie jadalny</h6><h3 id="edible">0</h3></div></div></div>
    <div class="col-md-3"><div class="card"><div class="card-body"><h6 class="card-subtitle text-muted">Trujące przepuszczone</h6><h3 id="missed">0</h3></div></div></div>
  </div>

  <h4>Ostatnie predykcje</h4>
  <table class="table table-striped table-sm">
    <thead><tr><th>Kapelusz [cm]</th><th>Kolor kapelusza</th><th>Siedlisko</th><th>P(trujący)</th><th>Decyzja</th><th>Prawdziwa klasa</th></tr></thead>
    <tbody id="rows"></tbody>
  </table>

  <h4 class="mt-4">Wyślij własną obserwację</h4>
  <form id="form" class="row g-3 mb-3"></form>
  <div id="result" class="alert alert-secondary">Wypełnij formularz i wyślij.</div>
</div>

<script src="app.js?v=2"></script>
</body>
</html>
